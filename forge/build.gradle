plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "ldlib2.mixins.json"
    }
    mixin {
        defaultRefmapName = "ldlib2-forge-refmap.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modImplementation "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"

    implementation("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_stdlib_version}") {
        exclude group: "org.jetbrains", module: "annotations"
    }
    implementation "org.appliedenergistics.yoga:yoga:${rootProject.yoga_version}"
    implementation("dev.vfyjxf:taffy:${rootProject.taffy_version}") {
        exclude group: "it.unimi.dsi", module: "fastutil"
    }
    implementation "io.github.llamalad7:mixinextras-common:0.5.0"
    include "io.github.llamalad7:mixinextras-forge:0.5.0"

    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-forge-api:${rootProject.jei_version}") { transitive = false }
    modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    // Optional XEI integrations are excluded from the 1.20.1 platform bootstrap until
    // loader-specific source sets are restored.

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
    shadowBundle("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_stdlib_version}") {
        exclude group: "org.jetbrains", module: "annotations"
    }
    shadowBundle "org.appliedenergistics.yoga:yoga:${rootProject.yoga_version}"
    shadowBundle("dev.vfyjxf:taffy:${rootProject.taffy_version}") {
        exclude group: "it.unimi.dsi", module: "fastutil"
    }

    developmentForge("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_stdlib_version}") {
        exclude group: "org.jetbrains", module: "annotations"
    }
    developmentForge "org.appliedenergistics.yoga:yoga:${rootProject.yoga_version}"
    developmentForge("dev.vfyjxf:taffy:${rootProject.taffy_version}") {
        exclude group: "it.unimi.dsi", module: "fastutil"
    }
    developmentForge "io.github.llamalad7:mixinextras-common:0.5.0"
}

processResources {
    inputs.properties([
            version: project.version,
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_description: rootProject.mod_description,
            mod_license: rootProject.mod_license,
            mod_url: rootProject.mod_url,
            minecraft_version: rootProject.minecraft_version,
            forge_version: rootProject.forge_version,
            architectury_api_version: rootProject.architectury_api_version
    ])
    filesMatching("META-INF/mods.toml") {
        expand(inputs.properties)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    exclude "javax/annotation/**"
    exclude "edu/umd/cs/findbugs/**"
    exclude "org/jetbrains/annotations/**"
    exclude "module-info.class"
    exclude "META-INF/versions/**"
}

remapJar {
    input.set shadowJar.archiveFile
}
