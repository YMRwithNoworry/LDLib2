plugins {
    id "dev.architectury.loom" version "1.14-SNAPSHOT" apply false
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
    id "org.jetbrains.kotlin.jvm" version "2.1.20" apply false
    id "org.jetbrains.kotlin.plugin.lombok" version "2.1.20" apply false
    id "io.freefair.lombok" version "9.2.0" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "java-library"
    apply plugin: "maven-publish"
    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jetbrains.kotlin.plugin.lombok"
    apply plugin: "io.freefair.lombok"

    base {
        archivesName = "${rootProject.mod_id}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.shedaniel.me/" }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        maven { url "https://cursemaven.com" }
        maven { url "https://maven.blamejared.com/" }
        maven { url "https://modmaven.dev" }
        maven { url "https://maven.parchmentmc.org" }
        maven { url "https://maven.quiltmc.org/repository/release" }
        maven { url "https://maven.theillusivec4.top/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://jitpack.io/" }
        maven {
            url "https://maven.latvian.dev/releases"
            content {
                includeGroup "dev.latvian.mods"
                includeGroup "dev.latvian.apps"
            }
        }
        mavenCentral()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()

        compileOnly "org.projectlombok:lombok:1.18.38"
        annotationProcessor "org.projectlombok:lombok:1.18.38"
        implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_stdlib_version}"
        implementation "org.apache.commons:commons-lang3:3.17.0"
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"

        testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
        testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.0"
        testImplementation "org.mockito:mockito-core:5.5.0"
        testImplementation "org.mockito:mockito-junit-jupiter:5.5.0"
    }

    java {
        withSourcesJar()
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = "UTF-8"
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"
            showStandardStreams = false
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

tasks.register("buildFabric") {
    group = "ldlib2 build"
    description = "Build the 1.20.1 Fabric jar"
    dependsOn ":fabric:build"
}

tasks.register("buildForge") {
    group = "ldlib2 build"
    description = "Build the 1.20.1 Forge jar"
    dependsOn ":forge:build"
}

tasks.register("buildAll") {
    group = "ldlib2 build"
    description = "Build both 1.20.1 platform jars"
    dependsOn ":fabric:build", ":forge:build"
}
